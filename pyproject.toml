[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "0.1.0"
description = "Production RAG, built phase by phase against a financial/regulatory corpus"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "qdrant-client>=1.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pymupdf>=1.24",
    "typer>=0.15",
    "rich>=13.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Installed on the GPU box, not on the Mac. Keeps CUDA-versioned wheels out of RAG_VENV.
local = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pip-tools>=7.4",
    "pre-commit>=4.0",
]

[project.scripts]
rag = "rag.cli:app"

[tool.setuptools.packages.find]
include = ["rag*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
# Third-party libs without stubs; keep the list short and justified.
[[tool.mypy.overrides]]
module = ["fitz.*", "qdrant_client.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
